[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mms-eval"
version = "0.1.0"
description = "Real-reference calibrated MMS and reproducible image-set evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "Pillow>=9.5", "scipy>=1.10,<1.16", "scikit-learn>=1.3,<1.6"]

[project.optional-dependencies]
vision = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "torch-fidelity==0.3.0"]
paper = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "torch-fidelity==0.3.0", "clean-fid==0.1.35", "matplotlib>=3.8,<3.11"]
plots = ["matplotlib>=3.8,<3.11"]
test = ["pytest>=7"]

[project.scripts]
mms-eval = "mms_eval.cli:main"

[tool.setuptools.packages.find]
include = ["mms_eval*", "mms_multimodal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
